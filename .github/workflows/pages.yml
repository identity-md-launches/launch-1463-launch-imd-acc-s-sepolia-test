name: Deploy imd/acc Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Rebuilds the data snapshot (docs/data-api.md) about every 15 minutes, off the hour's rush.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Recomputed from the chain on every run; if a chain fails, the published file is kept.
      - name: Build data snapshot
        run: node tools/snapshot/build.mjs --out data/v1 --fallback https://imdacc.fun/data/v1/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
